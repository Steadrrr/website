# main 브랜치에 합쳐지면 웹 서버(/www/)로 FTP 자동 업로드
# 필요한 저장소 Secrets (Settings › Secrets and variables › Actions):
#   FTP_SERVER   예: ftp.example.com (주소만, ftp:// 없이)
#   FTP_USERNAME FTP 아이디
#   FTP_PASSWORD FTP 비밀번호
# 서버의 app/config.php 와 uploads 폴더(첨부·사진)는 절대 올리거나 지우지 않는다.
name: 서버 배포 (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets 확인
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::저장소 Settings › Secrets and variables › Actions 에 FTP_SERVER, FTP_USERNAME, FTP_PASSWORD 를 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: FTP 업로드 (바뀐 파일만)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /www/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            app/config.php
            uploads/**
            CLAUDE.md
            README.md
