# 경진대회 체험용 데모 사이트: contest 브랜치를 웹 서버의 /www/demo/ 폴더로 FTP 업로드
#   운영 사이트(/www/)와 같은 FTP 계정·Secrets 를 쓰지만, 올리는 곳은 demo 폴더뿐이다.
#   서버의 demo/app/config.php (데모 전용 DB·'demo' => true) 와 demo/uploads 는 올리거나 지우지 않는다.
#   서버 준비(데모 DB·config.php)가 끝나기 전에는 커밋 메시지에 [데모배포] 가 있을 때만 올린다.
name: 데모 사이트 배포 (FTP /demo)

on:
  push:
    branches: [contest]

concurrency:
  group: ftp-deploy # 운영 배포와 동시에 FTP 를 쓰지 않게 같은 묶음
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[데모배포]')
    runs-on: ubuntu-latest
    steps:
      - name: Secrets 확인
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::저장소 Settings › Secrets and variables › Actions 에 FTP_SERVER, FTP_USERNAME, FTP_PASSWORD 를 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: FTP 업로드 (바뀐 파일만, /www/demo/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /www/demo/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            app/config.php
            uploads/**
            CLAUDE.md
            README.md
            dev/**
