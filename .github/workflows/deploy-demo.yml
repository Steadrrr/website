# 경진대회 체험용 데모 사이트: contest 브랜치를 웹 서버의 /www/demo/ 폴더로 FTP 업로드
#   운영 사이트(/www/)와 같은 FTP 계정·Secrets 를 쓰지만, 올리는 곳은 demo 폴더뿐이다.
#   체험판은 config.php 없이 app/config.demo.php 로 운영 설정을 읽고, 같은 DB 의 demo_ 표만 쓴다 (서버에서 할 일 없음).
#   진단·설치 화면(check.php·diag.php·install.php)은 체험판 폴더에서는 스스로 404 로 막힌다.
#   주의: 커밋 메시지에 배포 표시 글자를 설명으로라도 쓰면 배포된다.
#   커밋 메시지에 [데모배포] 가 있을 때만 올린다.
name: 데모 사이트 배포 (FTP /demo)

on:
  push:
    branches: [contest]

concurrency:
  group: ftp-deploy # 운영 배포와 동시에 FTP 를 쓰지 않게 같은 묶음
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[데모배포]')
    runs-on: ubuntu-latest
    steps:
      - name: Secrets 확인
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::저장소 Settings › Secrets and variables › Actions 에 FTP_SERVER, FTP_USERNAME, FTP_PASSWORD 를 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: FTP 업로드 (바뀐 파일만, /www/demo/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /www/demo/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            app/config.php
            uploads/**
            CLAUDE.md
            README.md
            dev/**
